# npm trusted publishing must reference ci.yml on npmjs.com.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Check ESM and CommonJS package entry points
        run: npm run test:package
      - name: Type-check runnable examples
        if: matrix.node == 24
        run: npm run test:examples
      - name: Check API documentation build
        if: matrix.node == 24
        run: npm run build:docs
      - name: Collect coverage
        if: matrix.node == 24
        run: npm run test:coverage
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-24
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release/git creates the release commit and tag
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Build release package
        run: npm run build
      - name: Check release package entry points
        run: npm run test:package
      - name: Publish release
        # @semantic-release/npm checks OIDC first, then uses NPM_TOKEN if the exchange fails.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

  docs:
    name: Deploy API documentation
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build documentation
        run: npm run build:docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
