name: Release to NPM
on:
  push:
    branches:
      - main
permissions:
  contents: write # required by @semantic-release/git to push the release commit/tag
  id-token: write # required for OIDC trusted publishing to npm
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # auto-generated by GitHub Actions
      # Fallback auth: only used if OIDC trusted publishing isn't available yet
      # (e.g. the package's first-ever publish, before a trusted publisher can be
      # configured on an existing npmjs.com package page). @semantic-release/npm
      # tries OIDC first and falls back to this token automatically.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"
      - name: Ensure npm supports OIDC trusted publishing (requires npm >=11.5.1)
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build the package
        run: npm run build
      - name: Semantic Release
        run: npx semantic-release
